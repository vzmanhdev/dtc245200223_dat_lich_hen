name: ${COMPOSE_PROJECT_NAME:-manh_appointment}
x-logging: &rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-safe: &safe
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: *rotation

services:
  log-init:
    image: busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /app-logs && chmod 750 /app-logs && chown 101:101 /nginx-logs && chmod 750 /nginx-logs && chown 999:999 /postgres-logs && chmod 750 /postgres-logs"]
    volumes: ["app_logs:/app-logs", "nginx_logs:/nginx-logs", "postgres_logs:/postgres-logs"]
    network_mode: none
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    logging: *rotation

  postgres:
    <<: *safe
    image: postgres:17-bookworm@sha256:ec4dfc6571f04fe0731ce948c1500d676af49a7224392dcc6995cc1ee33a94bb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "logging_collector=on", "-c", "log_destination=stderr", "-c", "log_directory=/var/log/postgresql", "-c", "log_filename=postgresql-%a.log", "-c", "log_rotation_age=1d", "-c", "log_rotation_size=10MB", "-c", "log_truncate_on_rotation=on", "-c", "log_min_duration_statement=1000", "-c", "password_encryption=scram-sha-256", "-c", "log_connections=on"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "postgres_logs:/var/log/postgresql"]
    networks: [db]
    depends_on:
      log-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    shm_size: 128mb
    mem_limit: 768m

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: manh-appointment:local
    restart: "no"
    command: ["node", "app/migrate.js"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm run setup}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?Run npm run setup}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-manh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run setup}
    networks: [db]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    logging: *rotation

  app:
    <<: *safe
    image: manh-appointment:local
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm run setup}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run setup}
    networks: [frontend, db, monitoring]
    volumes: ["app_logs:/var/log/appointment"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    depends_on:
      migrate: {condition: service_completed_successfully}
      log-init: {condition: service_completed_successfully}
    mem_limit: 384m

  nginx:
    <<: *safe
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:e2a8fca8aa356d66159aaf8a877a9c126773635adf210503eefaaeaffeed6ad7
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/logs
    networks: [frontend, monitoring]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    depends_on:
      app: {condition: service_healthy}
      log-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/proxy-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  pgadmin:
    <<: *safe
    image: dpage/pgadmin4:9@sha256:33eb7d070ee7500d1513453773f61df1256fdea08257d4a3f4aebd8cf1cc87cf
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-manh@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Run npm run setup}
      PGADMIN_LISTEN_PORT: "8080"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    ports: ["127.0.0.1:${PGADMIN_PORT:-5050}:8080"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/postgres/servers.json:/pgadmin4/servers.json:ro
    networks: [db, management]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/misc/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 6
    mem_limit: 512m

  nginx-log-rotate:
    <<: *safe
    image: busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
    user: "101:101"
    pid: service:nginx
    network_mode: none
    command: ["sh", "-c", "while sleep 60; do if [ -f /logs/access.log ] && [ $$(wc -c < /logs/access.log) -gt 10485760 ]; then [ ! -f /logs/access.log.1 ] || mv /logs/access.log.1 /logs/access.log.2; mv /logs/access.log /logs/access.log.1; kill -USR1 1; fi; done"]
    volumes: ["nginx_logs:/logs"]
    read_only: true
    cap_drop: [ALL]
    depends_on:
      nginx: {condition: service_healthy}
    mem_limit: 16m

  postgres-exporter:
    <<: *safe
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1@sha256:9fca39a4307092387b7de884bed4b62205cb88a6a5fdb423b9a70ea80b34efb3
    environment:
      DATA_SOURCE_NAME: postgresql://appointment_monitor:${MONITOR_DB_PASSWORD:?Run npm run setup}@postgres:5432/${POSTGRES_DB:-appointment}?sslmode=disable
    networks: [db, monitoring]
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m

  nginx-exporter:
    <<: *safe
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:520c047935a8a59586c31f51a10d6b13e0efeb07221d7a49455ee51f236dcd62
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    networks: [monitoring]
    depends_on:
      nginx: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m

  cadvisor:
    <<: *safe
    image: ghcr.io/google/cadvisor:0.55.1@sha256:2e0be37be732d9dd545410f03c67de63e83de6876530078909c91ccb41a826db
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]
    # Host introspection exception, restricted to this local lab; never given to app.
    privileged: true
    mem_limit: 384m

  prometheus:
    <<: *safe
    image: prom/prometheus:v3.5.0@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring, management]
    cap_drop: [ALL]
    mem_limit: 512m

  loki:
    <<: *safe
    image: grafana/loki:3.5.1@sha256:3a4e80320df38087263e9d450fd812010ee57e1e0b0679465672c0e227441f43
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]
    cap_drop: [ALL]
    mem_limit: 512m

  promtail:
    <<: *safe
    image: grafana/promtail:3.5.1@sha256:7796bd5ae600370ef47e58901310c91e60dc15eb13a3b2e20f1a940cb2777a57
    user: "0:0"
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - app_logs:/var/log/appointment:ro
      - nginx_logs:/var/log/appointment-nginx:ro
      - postgres_logs:/var/log/appointment-postgres:ro
      - promtail_positions:/positions
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    depends_on:
      loki: {condition: service_started}
      log-init: {condition: service_completed_successfully}
    mem_limit: 192m

  grafana:
    <<: *safe
    image: grafana/grafana:12.1.1@sha256:5749a0e982878aedaa2d320ed14d3bdce7a040a938f482258670009d419a597f
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-manh}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run npm run setup}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring, management]
    cap_drop: [ALL]
    depends_on: [prometheus, loki]
    mem_limit: 384m

networks:
  frontend:
  db:
    internal: true
  monitoring:
    internal: true
  management:
volumes:
  postgres_data:
  postgres_logs:
  pgadmin_data:
  app_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
