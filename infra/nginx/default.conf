log_format appointment_json escape=json '{"time":"$time_iso8601","service":"nginx","method":"$request_method","status":$status,"duration":$request_time,"request_id":"$request_id"}';
limit_req_zone $binary_remote_addr zone=booking:10m rate=5r/s;
server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    server_name localhost;
    server_tokens off;
    client_max_body_size 16k;
    access_log /logs/access.log appointment_json;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /metrics { return 404; }
    location ^~ /health/ { return 404; }
    location = /stub_status { return 404; }
    location / {
        limit_req zone=booking burst=40 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $appointment_backend app:3000;
        proxy_pass http://$appointment_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /stub_status { stub_status; }
    location = /proxy-health { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 404; }
}
