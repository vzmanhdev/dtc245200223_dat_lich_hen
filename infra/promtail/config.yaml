server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: appointment
    static_configs:
      - targets: [localhost]
        labels:
          service: app
          environment: local
          __path__: /var/log/appointment/*.log*
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          service: nginx
          environment: local
          __path__: /var/log/appointment-nginx/*.log*
  - job_name: postgres
    static_configs:
      - targets: [localhost]
        labels:
          service: postgres
          environment: local
          __path__: /var/log/appointment-postgres/*.log
