<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><rect width="100%" height="100%" fill="white"/><text x="40" y="55.26" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#172d29" text-anchor="start">THU THẬP LOG VÀ TRA CỨU LOGQL</text><rect x="40" y="130" width="570" height="170" rx="16" fill="#eef1f8" stroke="#375e53" stroke-width="3"/><text x="62" y="183.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">app_logs</text><text x="62" y="236.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Pino JSON: app.log</text><polyline points="610,215 800,215" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="800,215 782.4998411139452,222.39894850386435 782.4998411139452,207.60105149613565" fill="#315d82"/><rect x="40" y="360" width="570" height="170" rx="16" fill="#eef1f8" stroke="#375e53" stroke-width="3"/><text x="62" y="413.15999999999997" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">nginx_logs</text><text x="62" y="466.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Access JSON: access.log</text><polyline points="610,445 800,445" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="800,445 782.4998411139452,452.39894850386435 782.4998411139452,437.60105149613565" fill="#315d82"/><rect x="40" y="590" width="570" height="170" rx="16" fill="#eef1f8" stroke="#375e53" stroke-width="3"/><text x="62" y="643.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">postgres_logs</text><text x="62" y="696.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Log DB: postgresql-*.log</text><polyline points="610,675 800,675" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="800,675 782.4998411139452,682.3989485038644 782.4998411139452,667.6010514961356" fill="#315d82"/><rect x="800" y="130" width="410" height="690" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="822" y="183.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Promtail</text><text x="820" y="323.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Mount log chỉ đọc</text><text x="820" y="388.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Parse JSON time</text><text x="820" y="453.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Gắn label service</text><text x="820" y="518.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Ghi vị trí đã đọc</text><text x="820" y="583.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Không Docker socket</text><rect x="1390" y="230" width="370" height="260" rx="16" fill="#f6f1e7" stroke="#375e53" stroke-width="3"/><text x="1412" y="283.15999999999997" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Loki :3100</text><text x="1412" y="336.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Lưu log / chỉ mục label</text><text x="1412" y="379.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Retention 168 giờ</text><polyline points="1210,355 1390,355" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1390,355 1372.4998411139452,362.39894850386435 1372.4998411139452,347.60105149613565" fill="#315d82"/><text x="1300" y="297.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172d29" text-anchor="middle">HTTP push</text><rect x="1390" y="730" width="370" height="210" rx="16" fill="#f6f1e7" stroke="#375e53" stroke-width="3"/><text x="1412" y="783.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Grafana Explore</text><text x="1412" y="836.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">LogQL → kết quả log</text><polyline points="1575,730 1575,490" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1575,490 1582.3989485038644,507.5001588860548 1567.6010514961356,507.5001588860548" fill="#315d82"/><text x="1600" y="613.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="start">LogQL</text><text x="40" y="926.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172d29" text-anchor="start">Ba nguồn file → Promtail → Loki: chiều dữ liệu log.</text><text x="40" y="974.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="start">Grafana → Loki: chiều yêu cầu truy vấn, không phải chiều đẩy log.</text><text x="40" y="1024.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="start">Pipeline hiện tại không thu stdout/stderr của tất cả container.</text></svg>