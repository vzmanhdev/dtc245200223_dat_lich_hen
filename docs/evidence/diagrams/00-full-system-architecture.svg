<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2280" viewBox="0 0 1800 2280"><rect width="100%" height="100%" fill="white"/><text x="40" y="50.26" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#172d29" text-anchor="start">KIẾN TRÚC TỔNG THỂ 13 SERVICE DOCKER COMPOSE</text><text x="40" y="104.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172d29" text-anchor="start">A  WEB VÀ DỮ LIỆU   |   frontend + db internal</text><rect x="40" y="140" width="290" height="205" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="62" y="193.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Trình duyệt</text><text x="62" y="246.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">HTTPS :443</text><text x="62" y="289.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">HTTP :8080 phụ</text><rect x="470" y="140" width="330" height="205" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="492" y="193.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">nginx</text><text x="492" y="246.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">TLS / headers</text><text x="492" y="289.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Proxy → app:3000</text><rect x="940" y="140" width="330" height="205" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="962" y="193.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">app</text><text x="962" y="246.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Express + EJS</text><text x="962" y="289.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Nghiệp vụ / session</text><rect x="1410" y="140" width="350" height="205" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1432" y="193.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">postgres</text><text x="1432" y="245.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">PostgreSQL 17 :5432</text><text x="1432" y="288.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Nghiệp vụ + session</text><rect x="40" y="435" width="440" height="185" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="62" y="488.15999999999997" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">log-init</text><text x="62" y="541.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Job khởi tạo quyền log</text><text x="62" y="584.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Chạy xong: Exited 0</text><rect x="940" y="435" width="330" height="185" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="962" y="488.15999999999997" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">migrate</text><text x="962" y="540.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Job schema 1/2/3</text><text x="962" y="583.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Chạy xong: Exited 0</text><rect x="1410" y="435" width="350" height="185" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1432" y="488.15999999999997" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">pgadmin</text><text x="1432" y="541.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Host :5050 → :8080</text><text x="1432" y="584.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">UI quản trị DB</text><polyline points="330,240 470,240" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="470,240 452.4998411139452,247.39894850386435 452.4998411139452,232.60105149613565" fill="#315d82"/><text x="400" y="217.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172d29" text-anchor="middle">443</text><polyline points="800,240 940,240" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="940,240 922.4998411139452,247.39894850386435 922.4998411139452,232.60105149613565" fill="#315d82"/><text x="870" y="217.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172d29" text-anchor="middle">3000</text><polyline points="1270,240 1410,240" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1410,240 1392.4998411139452,247.39894850386435 1392.4998411139452,232.60105149613565" fill="#315d82"/><text x="1340" y="217.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172d29" text-anchor="middle">5432</text><polyline points="1585,435 1585,345" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1585,345 1592.3989485038644,362.5001588860548 1577.6010514961356,362.5001588860548" fill="#315d82"/><text x="1610" y="396.32" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#172d29" text-anchor="start">SQL</text><polyline points="1270,500 1340,500 1340,385 1470,385 1470,345" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1470,345 1477.3989485038644,362.5001588860548 1462.6010514961356,362.5001588860548" fill="#315d82"/><text x="500" y="477.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">Các UI chỉ mở trên 127.0.0.1</text><text x="500" y="522.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">DB và app không publish port</text><text x="500" y="565.5" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#172d29" text-anchor="start">Job không phải dịch vụ chạy dài hạn</text><text x="40" y="726.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172d29" text-anchor="start">B  METRICS   |   mạng monitoring internal</text><rect x="40" y="790" width="580" height="130" rx="16" fill="#eaf0f8" stroke="#375e53" stroke-width="3"/><text x="62" y="843.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">App /metrics :3000</text><text x="62" y="896.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Tham chiếu service app ở vùng A</text><polyline points="850,855 620,855" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="620,855 637.5001588860548,847.6010514961356 637.5001588860548,862.3989485038644" fill="#315d82"/><text x="735" y="830.14" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172d29" text-anchor="middle">scrape</text><rect x="40" y="950" width="580" height="130" rx="16" fill="#eaf0f8" stroke="#375e53" stroke-width="3"/><text x="62" y="1003.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">nginx-exporter :9113</text><text x="62" y="1056.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Đọc nginx:8081/stub_status</text><polyline points="850,1015 620,1015" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="620,1015 637.5001588860548,1007.6010514961356 637.5001588860548,1022.3989485038644" fill="#315d82"/><text x="735" y="990.14" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172d29" text-anchor="middle">scrape</text><rect x="40" y="1110" width="580" height="130" rx="16" fill="#eaf0f8" stroke="#375e53" stroke-width="3"/><text x="62" y="1163.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">postgres-exporter :9187</text><text x="62" y="1216.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Đọc postgres:5432, role monitor</text><polyline points="850,1175 620,1175" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="620,1175 637.5001588860548,1167.6010514961356 637.5001588860548,1182.3989485038644" fill="#315d82"/><text x="735" y="1150.14" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172d29" text-anchor="middle">scrape</text><rect x="40" y="1270" width="580" height="130" rx="16" fill="#eaf0f8" stroke="#375e53" stroke-width="3"/><text x="62" y="1323.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">cadvisor :8080</text><text x="62" y="1376.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">CPU / RAM / Network container</text><polyline points="850,1335 620,1335" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="620,1335 637.5001588860548,1327.6010514961356 637.5001588860548,1342.3989485038644" fill="#315d82"/><text x="735" y="1310.14" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172d29" text-anchor="middle">scrape</text><rect x="850" y="790" width="400" height="610" rx="16" fill="#eaf0f8" stroke="#375e53" stroke-width="3"/><text x="872" y="843.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">prometheus :9090</text><text x="872" y="923.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Pull mỗi 15 giây</text><text x="872" y="978.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">4 endpoint bên trái</text><text x="872" y="1033.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">+ tự scrape = 5 job</text><text x="872" y="1088.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Lưu TSDB: 7d / 1GB</text><text x="872" y="1143.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">prometheus_data</text><text x="872" y="1198.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Host UI :9090</text><rect x="1430" y="920" width="330" height="350" rx="16" fill="#fbf2df" stroke="#375e53" stroke-width="3"/><text x="1452" y="973.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">grafana :3000</text><text x="1450" y="1027.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">Host UI :3001</text><text x="1450" y="1077.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">14 panel metrics</text><text x="1450" y="1127.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">1 panel log / Explore</text><text x="1450" y="1177.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">grafana_data</text><polyline points="1430,1205 1250,1205" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1250,1205 1267.5001588860548,1197.6010514961356 1267.5001588860548,1212.3989485038644" fill="#315d82"/><text x="1340" y="1157.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172d29" text-anchor="middle">PromQL</text><text x="40" y="1526.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172d29" text-anchor="start">C  LOGS   |   volume chỉ đọc → Promtail → Loki</text><rect x="40" y="1580" width="580" height="130" rx="16" fill="#edf6ed" stroke="#375e53" stroke-width="3"/><text x="62" y="1633.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">app_logs</text><text x="62" y="1686.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">app.log: JSON thời gian sự kiện</text><polyline points="620,1645 850,1645" fill="none" stroke="#287747" stroke-width="4"/><polygon points="850,1645 832.4998411139452,1652.3989485038644 832.4998411139452,1637.6010514961356" fill="#287747"/><rect x="40" y="1740" width="580" height="130" rx="16" fill="#edf6ed" stroke="#375e53" stroke-width="3"/><text x="62" y="1793.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">nginx_logs</text><text x="62" y="1846.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">access.log: JSON thời gian sự kiện</text><polyline points="620,1805 850,1805" fill="none" stroke="#287747" stroke-width="4"/><polygon points="850,1805 832.4998411139452,1812.3989485038644 832.4998411139452,1797.6010514961356" fill="#287747"/><rect x="40" y="1900" width="580" height="130" rx="16" fill="#edf6ed" stroke="#375e53" stroke-width="3"/><text x="62" y="1953.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">postgres_logs</text><text x="62" y="2006.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">*.log: log PostgreSQL dạng text</text><polyline points="620,1965 850,1965" fill="none" stroke="#287747" stroke-width="4"/><polygon points="850,1965 832.4998411139452,1972.3989485038644 832.4998411139452,1957.6010514961356" fill="#287747"/><rect x="850" y="1580" width="400" height="480" rx="16" fill="#edf6ed" stroke="#375e53" stroke-width="3"/><text x="872" y="1633.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">promtail :9080</text><text x="872" y="1702.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">Đọc 3 nguồn file</text><text x="872" y="1752.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">Parse time / gắn label</text><text x="872" y="1802.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">Lưu offset: positions</text><text x="872" y="1852.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">Mount log chỉ đọc</text><text x="872" y="1902.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">Không Docker socket</text><rect x="1430" y="1760" width="330" height="270" rx="16" fill="#edf6ed" stroke="#375e53" stroke-width="3"/><text x="1452" y="1813.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">loki :3100</text><text x="1450" y="1862.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">LogQL / TSDB v13</text><text x="1450" y="1912.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">loki_data</text><text x="1450" y="1962.14" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#172d29" text-anchor="start">Retention 168 giờ</text><polyline points="1250,1975 1430,1975" fill="none" stroke="#287747" stroke-width="4"/><polygon points="1430,1975 1412.4998411139452,1982.3989485038644 1412.4998411139452,1967.6010514961356" fill="#287747"/><text x="1340" y="1926.32" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172d29" text-anchor="middle">HTTP push</text><polyline points="1595,1270 1595,1760" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1595,1760 1587.6010514961356,1742.4998411139452 1602.3989485038644,1742.4998411139452" fill="#315d82"/><text x="1615" y="1452.96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172d29" text-anchor="start">LogQL</text><text x="40" y="2142.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#315d82" text-anchor="start">Xanh dương: chiều yêu cầu web / SQL / scrape / truy vấn; phản hồi đi ngược lại.</text><text x="40" y="2192.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#287747" text-anchor="start">Xanh lá: chiều dữ liệu log. Các volume là nơi lưu dữ liệu, không tính thêm service.</text><text x="40" y="2242.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">13 service = 11 chạy dài hạn + 2 job; sơ đồ chi tiết từng luồng nằm trong các phần tiếp theo.</text></svg>