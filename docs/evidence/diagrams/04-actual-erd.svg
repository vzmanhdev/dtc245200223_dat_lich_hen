<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1520" viewBox="0 0 1800 1520"><rect width="100%" height="100%" fill="white"/><text x="40" y="55.26" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#172d29" text-anchor="start">MÔ HÌNH DỮ LIỆU THEO SCHEMA THỰC TẾ</text><rect x="40" y="120" width="460" height="200" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="62" y="173.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">staff</text><text x="62" y="226.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">PK id; full_name; active</text><rect x="670" y="120" width="460" height="200" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="692" y="173.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">staff_services</text><text x="692" y="226.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">PK (staff_id, service_id)</text><text x="692" y="269.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">FK → staff, services</text><rect x="1300" y="120" width="460" height="200" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1322" y="173.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">services</text><text x="1322" y="226.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">PK id; duration_minutes</text><text x="1322" y="269.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">price; active</text><rect x="670" y="530" width="460" height="240" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="692" y="583.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">time_slots</text><text x="692" y="636.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">PK id; start_at; end_at</text><text x="692" y="679.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">FK staff_id → staff</text><text x="692" y="722.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">FK service_id → services</text><rect x="40" y="950" width="460" height="220" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="62" y="1003.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">customer_accounts</text><text x="62" y="1056.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">PK id; email; active</text><text x="62" y="1099.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">password_hash</text><rect x="670" y="950" width="460" height="220" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="692" y="1003.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">customers</text><text x="692" y="1056.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">PK id; liên hệ snapshot</text><text x="692" y="1099.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">FK account_id → tài khoản</text><rect x="1300" y="950" width="460" height="270" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1322" y="1003.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">appointments</text><text x="1322" y="1055.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">PK id; booking_code; status</text><text x="1322" y="1098.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">FK customer_id → customers</text><text x="1322" y="1141.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">FK slot_id → time_slots</text><text x="1322" y="1184.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Snapshot dịch vụ / người / giá</text><rect x="1300" y="1320" width="460" height="170" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1322" y="1373.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">appointment_events</text><text x="1322" y="1426.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">FK appointment_id → lịch</text><text x="1322" y="1469.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Trạng thái / tác nhân / giờ</text><polyline points="500,220 670,220" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="670,220 652.4998411139452,227.39894850386435 652.4998411139452,212.60105149613565" fill="#315d82"/><text x="585" y="179.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="middle">1—N</text><polyline points="1300,220 1130,220" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1130,220 1147.5001588860548,212.60105149613565 1147.5001588860548,227.39894850386435" fill="#315d82"/><text x="1215" y="179.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="middle">1—N</text><polyline points="270,320 270,650 670,650" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="670,650 652.4998411139452,657.3989485038644 652.4998411139452,642.6010514961356" fill="#315d82"/><text x="300" y="614.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="start">1—N</text><polyline points="1530,320 1530,650 1130,650" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1130,650 1147.5001588860548,642.6010514961356 1147.5001588860548,657.3989485038644" fill="#315d82"/><text x="1435" y="614.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="start">1—N</text><polyline points="500,1060 670,1060" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="670,1060 652.4998411139452,1067.3989485038644 652.4998411139452,1052.6010514961356" fill="#315d82"/><text x="585" y="1014.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="middle">1—N</text><polyline points="1130,1060 1300,1060" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1300,1060 1282.4998411139452,1067.3989485038644 1282.4998411139452,1052.6010514961356" fill="#315d82"/><text x="1215" y="1014.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="middle">1—N</text><polyline points="900,770 900,850 1530,850 1530,950" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1530,950 1522.6010514961356,932.4998411139452 1537.3989485038644,932.4998411139452" fill="#315d82"/><text x="1170" y="828.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="middle">1—N trong lịch sử</text><polyline points="1530,1220 1530,1320" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1530,1320 1522.6010514961356,1302.4998411139452 1537.3989485038644,1302.4998411139452" fill="#315d82"/><text x="1570" y="1284.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="start">1—N</text><text x="40" y="1293.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="start">Mũi tên: bảng cha → bảng chứa khóa ngoại.</text><text x="40" y="1343.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="start">Tài khoản sở hữu lịch thông qua customers.account_id.</text><text x="40" y="1393.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="start">Không có appointments.account_id trong schema hiện tại.</text><text x="40" y="1452.96" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#172d29" text-anchor="start">Session, admin_users và schema_migrations là bảng hỗ trợ.</text></svg>