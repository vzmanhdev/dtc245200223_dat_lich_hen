<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960"><rect width="100%" height="100%" fill="white"/><text x="40" y="55.26" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#172d29" text-anchor="start">LUỒNG TRUY CẬP WEB VÀ DỮ LIỆU</text><rect x="40" y="140" width="460" height="240" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="62" y="193.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Khách / quản trị viên</text><text x="62" y="246.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Trình duyệt trên Windows</text><text x="62" y="289.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">https://localhost</text><text x="62" y="332.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">HTTP 8080: kênh lab phụ</text><rect x="670" y="140" width="460" height="240" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="692" y="193.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Nginx reverse proxy</text><text x="692" y="246.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Kết thúc TLS 1.2 / 1.3</text><text x="692" y="289.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Headers và giới hạn request</text><text x="692" y="332.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Chỉ publish lên loopback</text><rect x="1300" y="140" width="460" height="240" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1322" y="190.7" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#172d29" text-anchor="start">Ứng dụng Express + EJS</text><text x="1322" y="246.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">HTTP nội bộ app:3000</text><text x="1322" y="289.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Frontend + xử lý nghiệp vụ</text><text x="1322" y="332.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Session, CSRF, transaction</text><rect x="40" y="620" width="460" height="230" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="62" y="673.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">Quản trị cơ sở dữ liệu</text><text x="62" y="725.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Trình duyệt của quản trị</text><text x="62" y="768.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">http://localhost:5050</text><text x="62" y="811.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Tài khoản riêng của pgAdmin</text><rect x="670" y="620" width="460" height="230" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="692" y="673.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">pgAdmin</text><text x="692" y="726.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Container pgadmin:8080</text><text x="692" y="769.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Giao diện xem / truy vấn DB</text><text x="692" y="812.24" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#172d29" text-anchor="start">Không phải backend đặt lịch</text><rect x="1300" y="620" width="460" height="230" rx="16" fill="#eef4f1" stroke="#375e53" stroke-width="3"/><text x="1322" y="673.16" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172d29" text-anchor="start">PostgreSQL 17</text><text x="1322" y="725.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">postgres:5432 trong mạng db</text><text x="1322" y="768.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Nghiệp vụ + session</text><text x="1322" y="811.42" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#172d29" text-anchor="start">Không publish 5432 ra host</text><polyline points="500,260 670,260" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="670,260 652.4998411139452,267.39894850386435 652.4998411139452,252.60105149613565" fill="#315d82"/><text x="585" y="213.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="middle">HTTPS</text><text x="585" y="247.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="middle">443</text><polyline points="1130,260 1300,260" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1300,260 1282.4998411139452,267.39894850386435 1282.4998411139452,252.60105149613565" fill="#315d82"/><text x="1215" y="213.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="middle">HTTP</text><text x="1215" y="247.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="middle">3000</text><polyline points="1530,380 1530,620" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1530,620 1522.6010514961356,602.4998411139452 1537.3989485038644,602.4998411139452" fill="#315d82"/><text x="1555" y="500.42" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#172d29" text-anchor="start">SQL / 5432</text><polyline points="500,730 670,730" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="670,730 652.4998411139452,737.3989485038644 652.4998411139452,722.6010514961356" fill="#315d82"/><text x="585" y="683.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="middle">HTTP</text><text x="585" y="717.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="middle">5050</text><polyline points="1130,730 1300,730" fill="none" stroke="#315d82" stroke-width="4"/><polygon points="1300,730 1282.4998411139452,737.3989485038644 1282.4998411139452,722.6010514961356" fill="#315d82"/><text x="1215" y="683.78" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#172d29" text-anchor="middle">SQL</text><text x="1215" y="717.78" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#172d29" text-anchor="middle">5432</text><text x="40" y="934.6" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#172d29" text-anchor="start">Mũi tên: bên chủ động gửi yêu cầu → bên tiếp nhận; phản hồi đi theo chiều ngược lại.</text></svg>